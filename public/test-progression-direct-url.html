<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test URL directe ProgressionLive</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        input { padding: 8px; margin: 5px; width: 300px; }
        button { padding: 10px; margin: 10px 0; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Test de l'URL directe ProgressionLive</h1>
    
    <div class="test-section">
        <h2>Informations de connexion</h2>
        <div id="userInfo"></div>
    </div>
    
    <div class="test-section">
        <h2>Test URL directe</h2>
        <label>File ID: <input type="text" id="fileId" placeholder="ID du fichier" value="31177"></label><br>
        <label>Nom du fichier: <input type="text" id="fileName" placeholder="Nom du fichier" value="PANNEAU.jpeg"></label><br>
        <button onclick="testDirectUrl()">Tester l'URL directe</button>
        <button onclick="openDirectUrl()">Ouvrir dans un nouvel onglet</button>
        <div id="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Aperçu</h2>
        <iframe id="preview" width="100%" height="500" style="border: 1px solid #ddd; display: none;"></iframe>
    </div>
    
    <script>
        // Charger les informations de l'utilisateur
        function loadUserInfo() {
            const userInfoDiv = document.getElementById('userInfo');
            const cachedUser = localStorage.getItem('progressionUser');
            
            if (cachedUser) {
                const userData = JSON.parse(cachedUser);
                userInfoDiv.innerHTML = `
                    <p class="success">✅ Utilisateur connecté</p>
                    <p>Domaine: <strong>${userData.domain}</strong></p>
                    <p>Utilisateur: <strong>${userData.username}</strong></p>
                `;
            } else {
                userInfoDiv.innerHTML = '<p class="error">❌ Aucun utilisateur ProgressionLive connecté</p>';
            }
        }
        
        // Construire l'URL directe
        function buildDirectUrl(fileId, fileName) {
            const cachedUser = localStorage.getItem('progressionUser');
            if (!cachedUser) return null;
            
            const userData = JSON.parse(cachedUser);
            const domain = userData.domain;
            
            return `https://${domain}.progressionlive.com/web/exe/attachment/${encodeURIComponent(fileName)}?id=${fileId}&entityName=TXAttachment`;
        }
        
        // Tester l'URL directe
        function testDirectUrl() {
            const fileId = document.getElementById('fileId').value;
            const fileName = document.getElementById('fileName').value;
            const resultDiv = document.getElementById('result');
            const preview = document.getElementById('preview');
            
            const url = buildDirectUrl(fileId, fileName);
            
            if (!url) {
                resultDiv.innerHTML = '<p class="error">❌ Impossible de construire l\'URL (utilisateur non connecté)</p>';
                return;
            }
            
            resultDiv.innerHTML = `
                <p class="info">URL construite:</p>
                <pre>${url}</pre>
                <p class="info">Chargement dans l'iframe...</p>
            `;
            
            preview.src = url;
            preview.style.display = 'block';
        }
        
        // Ouvrir dans un nouvel onglet
        function openDirectUrl() {
            const fileId = document.getElementById('fileId').value;
            const fileName = document.getElementById('fileName').value;
            
            const url = buildDirectUrl(fileId, fileName);
            
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('Impossible de construire l\'URL (utilisateur non connecté)');
            }
        }
        
        // Charger les infos au démarrage
        loadUserInfo();
    </script>
</body>
</html>
