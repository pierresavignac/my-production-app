<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Visualiseur d'images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            position: absolute;
            color: red;
            padding: 15px;
            border: 1px solid #ffcccc;
            background-color: #ffeeee;
            border-radius: 4px;
            text-align: center;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img id="main-image" src="" alt="Image" />
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Chargement de l'image...</span>
        </div>
        <div id="error-message" class="error hidden">
            Une erreur s'est produite lors du chargement de l'image.
        </div>
    </div>
    
    <script>
    // Récupérer les paramètres de l'URL
    function getParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    
    // Obtenir des paramètres
    const installationId = getParam('ins');
    const fileName = getParam('file');
    
    // Variables pour les chemins d'images
    let imagePath = '';
    let displayFileName = fileName || 'Image';
    
    // Gérer le chargement de l'image
    function loadImage() {
        const img = document.getElementById('main-image');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-message');
        
        // S'il y a un fichier et une installation, on construit le chemin
        if (fileName && installationId) {
            // Chemin vers le fichier image sur le serveur
            imagePath = `/temp/files/${installationId}/${fileName}`;
            
            // Mettre à jour les attributs de l'image
            img.src = imagePath;
            img.alt = displayFileName;
            
            // Gérer les événements de chargement
            img.onload = function() {
                loading.classList.add('hidden');
                errorMsg.classList.add('hidden');
            };
            
            img.onerror = function() {
                loading.classList.add('hidden');
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = `Impossible de charger l'image: ${fileName}`;
            };
        } else {
            // Pas de paramètres valides
            loading.classList.add('hidden');
            errorMsg.classList.remove('hidden');
            errorMsg.textContent = "Paramètres manquants pour afficher l'image";
        }
    }
    
    // Charger l'image au chargement de la page
    window.onload = loadImage;
    </script>
</body>
</html>
